<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>パン工房プクムク 店舗3Dモデル確認ビューワー</title>
  <style>
    body {
      margin: 0;
      background: #fdf6ec;
      font-family: sans-serif;
      overflow: hidden;
    }

    #ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.95);
      padding: 16px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      max-width: 320px;
      z-index: 10;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 17px;
      color: #793802;
    }

    p {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    .tip {
      font-size: 12px;
      color: #d87310;
      font-weight: bold;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
  <div id="ui-panel">
    <h2>🥖 パン工房プクムク 店舗モデル確認</h2>
    <p>
      ・赤い看板「PUKUMUKU」オーニング<br>
      ・黄色い月 ＆ 白い雲のキャラクター<br>
      ・右側の名物「大きな太陽のゲート」<br>
      ・木枠のショーケース窓口＆引き戸
    </p>
    <div class="tip">💡 マウスドラッグで360度回転・ホイールで拡大縮小できます！</div>
  </div>

  <div id="canvas-container" style="width:100vw; height:100vh;"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfcf3e3);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.5, 7.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.0, 0);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffeedd, 0.95));
    const dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(4, 8, 6);
    scene.add(dir);

    const grid = new THREE.GridHelper(12, 24, 0xd4a373, 0xe9d2b8);
    scene.add(grid);

    function createShopWallTexture() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#F5ECCF'; ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#EAD8AA'; ctx.lineWidth = 3;
      for (let y = 0; y < 512; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke(); }
      const colors = ['#2980B9', '#F1C40F', '#E67E22', '#27AE60'];
      for (let row = 0; row < 12; row++) {
        const y = row * 44 + 20;
        const offset = (row % 2 === 0) ? 0 : 24;
        for (let col = 0; col < 12; col++) {
          const x = col * 48 + offset;
          ctx.fillStyle = colors[(row + col) % colors.length];
          ctx.beginPath();
          ctx.arc(x, y - 6, 12, Math.PI, 0);
          ctx.lineTo(x + 10, y + 10);
          ctx.lineTo(x - 10, y + 10);
          ctx.closePath();
          ctx.fill();
        }
      }
      const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2, 2); return tex;
    }
    function createWoodTexture() {
      const c = document.createElement('canvas'); c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8B4823'; ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = '#683313'; ctx.lineWidth = 4;
      for (let y = 0; y < 256; y += 10) {
        ctx.beginPath(); ctx.moveTo(0, y + (Math.sin(y * 0.25) * 5)); ctx.lineTo(256, y + (Math.cos(y * 0.25) * 5)); ctx.stroke();
      }
      return new THREE.CanvasTexture(c);
    }
    function createSignboardTexture() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#E74C3C'; ctx.fillRect(0, 0, 512, 128);
      ctx.strokeStyle = '#5E1B13'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, 502, 118);
      ctx.fillStyle = '#1A0E0B'; ctx.font = '900 36px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('PANKOUBOU PUKUMUKU', 256, 64);
      return new THREE.CanvasTexture(c);
    }
    function createSunFaceTexture() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#F4D03F'; ctx.beginPath(); ctx.arc(256, 256, 240, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1A1A1A';
      ctx.beginPath(); ctx.arc(180, 200, 22, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(180, 160, 26, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(332, 200, 22, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(332, 160, 26, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(256, 240, 16, 0, Math.PI); ctx.stroke();
      ctx.fillStyle = '#E74C3C';
      ctx.beginPath(); ctx.arc(256, 256, 230, Math.PI * 0.15, Math.PI * 0.85); ctx.lineTo(120, 360); ctx.lineTo(392, 360); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('NAKANOKU MINAMIDAI 4-6-4', 256, 335);
      return new THREE.CanvasTexture(c);
    }

    function createMoonTexture() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#F4D03F'; ctx.beginPath(); ctx.arc(256, 256, 230, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 14; ctx.stroke();
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.ellipse(220, 200, 30, 42, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#1A1A1A'; ctx.beginPath(); ctx.arc(225, 205, 16, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(250, 230); ctx.quadraticCurveTo(310, 235, 270, 260); ctx.stroke();
      ctx.beginPath(); ctx.arc(230, 280, 28, 0.2, Math.PI * 0.9); ctx.stroke();
      ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(140, 320); ctx.lineTo(80, 420); ctx.lineTo(130, 470); ctx.stroke();
      return new THREE.CanvasTexture(c);
    }
    function createCloudTexture() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(256, 256, 230, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 14; ctx.stroke();
      ctx.fillStyle = '#1A1A1A';
      ctx.beginPath(); ctx.arc(210, 210, 20, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(290, 210, 20, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(210, 180, 22, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(290, 180, 22, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(250, 250, 16, 0, Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(250, 285, 20, 0.1, Math.PI * 0.9); ctx.stroke();
      ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(340, 310); ctx.lineTo(410, 400); ctx.lineTo(370, 460); ctx.stroke();
      return new THREE.CanvasTexture(c);
    }

    const wallTex = createShopWallTexture();
    const woodTex = createWoodTexture();
    const signTex = createSignboardTexture();
    const sunFaceTex = createSunFaceTexture();
    const moonTex = createMoonTexture();
    const cloudTex = createCloudTexture();
    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.load('models/pukumuku_shop.glb?v=20260924_17', (gltf) => {
      const shop = gltf.scene;
      shop.position.set(0, 0, 0);
      shop.traverse((child) => {
        if (child.isMesh) {
          child.receiveShadow = true;
          const n = child.name;
          if (n.includes('Wall') || n.includes('Shop_Wall')) {
            child.material = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.65 });
          } else if (n.includes('AwningText') || n.includes('Awning') || n.includes('plt')) {
            child.material = new THREE.MeshStandardMaterial({ map: signTex, roughness: 0.35 });
          } else if (n.includes('ShowcaseFrame') || n.includes('DoorFrame') || n.includes('Shelf')) {
            child.material = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.5 });
          } else if (n.includes('SunFace')) {
            child.material = new THREE.MeshStandardMaterial({ map: sunFaceTex, roughness: 0.3 });
          } else if (n.includes('Moon')) {
            child.material = new THREE.MeshStandardMaterial({ map: moonTex, roughness: 0.3 });
          } else if (n.includes('Cloud')) {
            child.material = new THREE.MeshStandardMaterial({ map: cloudTex, roughness: 0.3 });
          } else if (n.includes('Bread')) {
            child.material = new THREE.MeshStandardMaterial({ color: 0xD37318, roughness: 0.4 });
          } else if (n.includes('SunFlame')) {
            child.material = new THREE.MeshStandardMaterial({ color: 0xE74C3C, roughness: 0.4 });
          }
        }
      });
      scene.add(shop);
    }, undefined, (err) => {
      console.error('Error loading shop GLB:', err);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>

</html>
